<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clase 1 – AI Influencer / Modelo UGC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050505;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage img.slide{position:absolute;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;opacity:0;transition:opacity .25s ease;pointer-events:none;-webkit-user-drag:none}
#stage img.slide.on{opacity:1}
#zl,#zr{position:fixed;top:0;bottom:0;width:50%;z-index:2;cursor:pointer}
#zl{left:0}#zr{right:0}
.ui{transition:opacity .3s ease}
body.hide .ui{opacity:0;pointer-events:none}
body.hide{cursor:none}
.btn{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;cursor:pointer;font:500 13px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s}
.btn:hover{background:rgba(0,0,0,.8)}
.arrow{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;z-index:5;padding:0}
#prev{left:14px}#next{right:14px}
.arrow svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#top .btn{height:34px;padding:0 14px}
#right{display:flex;gap:8px;position:relative}
#menuBtn{width:34px;padding:0!important;font-size:18px}
#menu{position:absolute;top:40px;right:0;min-width:190px;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px;display:none;flex-direction:column;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#menu.open{display:flex}
#menu button{background:none;border:0;color:#fff;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;font:13px system-ui,sans-serif}
#menu button:hover{background:rgba(255,255,255,.12)}
#counter{position:fixed;bottom:14px;right:14px;z-index:5;padding:6px 12px;border-radius:10px;font-size:13px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);font-variant-numeric:tabular-nums}
#bar{position:fixed;left:0;bottom:0;height:3px;width:100%;z-index:5;background:rgba(255,255,255,.08)}
#bar i{display:block;height:100%;width:0;background:#ff8a7a;transition:width .25s ease}
#panel{position:fixed;top:0;left:0;bottom:0;width:230px;z-index:20;background:rgba(10,10,10,.96);border-right:1px solid rgba(255,255,255,.14);transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.1)}
#panel header button{width:28px;height:28px;font-size:16px}
#thumbs{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.th{position:relative;border:2px solid transparent;border-radius:6px;cursor:pointer;background:#111;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10}
.th img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.th span{position:absolute;left:5px;top:4px;font-size:11px;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:5px}
.th.active{border-color:#ff8a7a}
@media (max-width:600px){.arrow{width:38px;height:38px}#panel{width:70vw}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="zl"></div><div id="zr"></div>

<div id="top" class="ui">
  <button class="btn" id="thumbBtn">Diapositivas</button>
  <div id="right">
    <button class="btn" id="presentBtn">Presentar</button>
    <button class="btn" id="menuBtn" aria-label="Menú">⋯</button>
    <div id="menu">
      <button data-a="first">Primera diapositiva</button>
      <button data-a="last">Última diapositiva</button>
      <button data-a="fs">Fullscreen</button>
      <button data-a="thumbs">Ver miniaturas</button>
    </div>
  </div>
</div>

<button class="btn arrow ui" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="btn arrow ui" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<div id="counter" class="ui">1 / 1</div>
<div id="bar" class="ui"><i></i></div>

<aside id="panel">
  <header><span>Diapositivas</span><button class="btn" id="closePanel" aria-label="Cerrar">✕</button></header>
  <div id="thumbs"></div>
</aside>

<script>
(function(){
  var MAX=12, DIR='assets/';
  var pad=function(n){return n<10?'0'+n:''+n};
  var src=function(n){return DIR+'slide_'+pad(n)+'.png'};
  var slides=[], cur=0, imgs=[];
  var stage=document.getElementById('stage'), counter=document.getElementById('counter'),
      barI=document.querySelector('#bar i'), panel=document.getElementById('panel'),
      thumbs=document.getElementById('thumbs'), menu=document.getElementById('menu');

  // Detecta qué slides existen (hasta MAX). Las que falten se omiten solas.
  function probe(n){return new Promise(function(res){var i=new Image();i.onload=function(){res(n)};i.onerror=function(){res(null)};i.src=src(n)})}
  Promise.all(Array.from({length:MAX},function(_,k){return probe(k+1)})).then(function(r){
    slides=r.filter(Boolean);
    if(!slides.length){stage.innerHTML='<p style="opacity:.6;font-size:14px">No se encontraron imágenes en /assets/</p>';return}
    build();
    var h=parseInt(location.hash.slice(1),10);
    go(h>=1&&h<=slides.length?h-1:0,true);
  });

  function build(){
    slides.forEach(function(n,i){
      var im=document.createElement('img');
      im.className='slide';im.alt='Diapositiva '+(i+1);im.draggable=false;im.src=src(n);
      stage.appendChild(im);imgs.push(im);
      var t=document.createElement('div');t.className='th';
      t.innerHTML='<img alt="" loading="lazy" src="'+src(n)+'"><span>'+(i+1)+'</span>';
      t.onclick=function(){go(i);if(innerWidth<700)panel.classList.remove('open')};
      thumbs.appendChild(t);
    });
  }

  function go(i,first){
    if(!slides.length)return;
    i=Math.max(0,Math.min(slides.length-1,i));
    imgs.forEach(function(im,k){im.classList.toggle('on',k===i)});
    cur=i;
    counter.textContent=(i+1)+' / '+slides.length;
    barI.style.width=((i+1)/slides.length*100)+'%';
    var ths=thumbs.children;
    for(var k=0;k<ths.length;k++)ths[k].classList.toggle('active',k===i);
    if(ths[i]&&panel.classList.contains('open'))ths[i].scrollIntoView({block:'nearest'});
    // precarga vecinas (ya cargadas por el DOM, forzamos decode)
    [i-1,i+1].forEach(function(k){if(imgs[k]&&imgs[k].decode)imgs[k].decode().catch(function(){})});
    try{history.replaceState(null,'','#'+(i+1))}catch(e){}
  }
  var next=function(){go(cur+1)}, prev=function(){go(cur-1)};

  document.getElementById('next').onclick=function(e){e.stopPropagation();next()};
  document.getElementById('prev').onclick=function(e){e.stopPropagation();prev()};
  document.getElementById('zr').onclick=next;
  document.getElementById('zl').onclick=prev;

  document.addEventListener('keydown',function(e){
    switch(e.key){
      case 'ArrowRight':case 'PageDown':case ' ':e.preventDefault();next();break;
      case 'ArrowLeft':case 'PageUp':e.preventDefault();prev();break;
      case 'Home':go(0);break;
      case 'End':go(slides.length-1);break;
      case 'f':case 'F':toggleFS();break;
      case 'Escape':panel.classList.remove('open');menu.classList.remove('open');break;
    }
  });

  // swipe
  var sx=null,sy=null;
  document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  document.addEventListener('touchend',function(e){
    if(sx===null)return;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?next():prev();swiped=true;setTimeout(function(){swiped=false},400)}
    sx=null;
  },{passive:true});
  var swiped=false;
  // evita doble disparo swipe + click en móvil
  ['zl','zr'].forEach(function(id){document.getElementById(id).addEventListener('click',function(e){if(swiped){e.stopImmediatePropagation()}},true)});

  // fullscreen
  function isFS(){return document.fullscreenElement||document.webkitFullscreenElement}
  function toggleFS(){
    var el=document.documentElement;
    if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{var f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)f.call(el)}
  }
  document.getElementById('presentBtn').onclick=function(){panel.classList.remove('open');toggleFS();wake()};

  // panel / menú
  function togglePanel(){panel.classList.toggle('open');menu.classList.remove('open');if(panel.classList.contains('open')){var t=thumbs.children[cur];t&&t.scrollIntoView({block:'center'})}}
  document.getElementById('thumbBtn').onclick=togglePanel;
  document.getElementById('closePanel').onclick=function(){panel.classList.remove('open')};
  document.getElementById('menuBtn').onclick=function(e){e.stopPropagation();menu.classList.toggle('open')};
  menu.onclick=function(e){
    var a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    menu.classList.remove('open');
    if(a==='first')go(0);else if(a==='last')go(slides.length-1);else if(a==='fs')toggleFS();else if(a==='thumbs')togglePanel();
  };
  document.addEventListener('click',function(e){if(!menu.contains(e.target)&&e.target.id!=='menuBtn')menu.classList.remove('open')});

  // auto-ocultar controles (~2.5 s)
  var timer;
  function wake(){
    document.body.classList.remove('hide');clearTimeout(timer);
    timer=setTimeout(function(){
      if(panel.classList.contains('open')||menu.classList.contains('open'))return wake();
      document.body.classList.add('hide');
    },2500);
  }
  ['mousemove','mousedown','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,wake,{passive:true})});
  wake();
})();
</script>
</body>
</html>
